name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: wh
          POSTGRES_USER: wh
          POSTGRES_PASSWORD: wh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wh -d wh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SECRET_KEY: ci-only-secret-key
      DATABASE_URL: postgres://wh:wh@localhost:5432/wh

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run

      - name: Tests
        run: pytest --cov=apps --cov-report=term-missing

      - name: Production settings pass Django's deployment checks
        env:
          DEBUG: "false"
          ALLOWED_HOSTS: example.com
        run: |
          export SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(64))')"
          python manage.py check --deploy --fail-level WARNING

  # The README offers SQLite as the no-Docker alternative: the whole suite must pass there too
  # (only the PostgreSQL exclusion-constraint tests are skipped).
  test-sqlite:
    runs-on: ubuntu-latest

    env:
      SECRET_KEY: ci-only-secret-key
      DATABASE_URL: sqlite:///ci.sqlite3

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Tests on SQLite
        run: pytest
